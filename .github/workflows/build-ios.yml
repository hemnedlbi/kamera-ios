name: Build iOS app (AltStore / SideStore)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use newest stable Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm ci || npm install

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build (unsigned — AltStore signs it with your Apple ID)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Kamera.ipa Payload
          ls -la Kamera.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kamera-ipa
          path: Kamera.ipa

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Kamera.ipa \
            --title "Kamera iOS — build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Install with AltStore or SideStore. Design & Development Hemn A.Muhammad"
