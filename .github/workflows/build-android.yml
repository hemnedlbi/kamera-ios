name: Build Android app

on:
  push:
    branches: [main, android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm ci || npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (for testing) and AAB (for Google Play)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease \
            -PversionCode=${{ github.run_number }}
          ls -la app/build/outputs/apk/debug app/build/outputs/bundle/release

      - name: Collect files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kamera-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Kamera-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Kamera-android
          path: |
            Kamera-test.apk
            Kamera-unsigned.aab

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main → "android-latest"; any other branch → test pre-release "android-test-<branch>"
          if [ "$GITHUB_REF_NAME" = "main" ]; then TAG=android-latest; PRE=""; else TAG="android-test-$GITHUB_REF_NAME"; PRE="--prerelease"; fi
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" Kamera-test.apk Kamera-unsigned.aab $PRE --target "$GITHUB_SHA" \
            --title "Kamera Android — build ${{ github.run_number }} ($GITHUB_REF_NAME)" \
            --notes "Kamera-test.apk: install directly on an Android phone for testing. Kamera-unsigned.aab: for Google Play (needs signing). Design & Development Hemn A.Muhammad"
